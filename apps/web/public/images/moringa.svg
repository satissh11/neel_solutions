<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="moringaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fee7"/>
      <stop offset="100%" stop-color="#ecfccb"/>
    </linearGradient>
    <linearGradient id="moringaLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
    <linearGradient id="moringaLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="32" fill="url(#moringaBg)"/>
  <circle cx="200" cy="200" r="140" fill="#ffffff" opacity="0.6"/>
  <g transform="translate(200, 200)">
    <!-- Branch -->
    <path d="M-60,90 Q0,20 60,-70" stroke="#365314" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Small pinnate leaflets characteristic of Moringa -->
    <ellipse cx="60" cy="-70" rx="14" ry="8" transform="rotate(-35 60 -70)" fill="url(#moringaLeaf)"/>
    <ellipse cx="35" cy="-60" rx="13" ry="7" transform="rotate(-65 35 -60)" fill="url(#moringaLight)"/>
    <ellipse cx="50" cy="-40" rx="13" ry="7" transform="rotate(25 50 -40)" fill="url(#moringaLight)"/>
    <ellipse cx="10" cy="-30" rx="14" ry="8" transform="rotate(-65 10 -30)" fill="url(#moringaLeaf)"/>
    <ellipse cx="28" cy="-10" rx="14" ry="8" transform="rotate(30 28 -10)" fill="url(#moringaLeaf)"/>
    <ellipse cx="-15" cy="0" rx="14" ry="8" transform="rotate(-60 -15 0)" fill="url(#moringaLight)"/>
    <ellipse cx="5" cy="20" rx="14" ry="8" transform="rotate(35 5 20)" fill="url(#moringaLight)"/>
    <ellipse cx="-40" cy="30" rx="15" ry="8" transform="rotate(-55 -40 30)" fill="url(#moringaLeaf)"/>
    <ellipse cx="-18" cy="50" rx="15" ry="8" transform="rotate(30 -18 50)" fill="url(#moringaLeaf)"/>
  </g>
  <text x="200" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#365314" text-anchor="middle" letter-spacing="2">MORINGA · ORGANIC</text>
  <text x="200" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#4d7c0f" text-anchor="middle">SUPERFOOD &amp; WELLNESS</text>
</svg>
